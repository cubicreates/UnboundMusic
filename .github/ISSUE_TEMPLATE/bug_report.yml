name: 🐛 Bug Report
description: Create a report to help us improve Unbound Music
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue in **Unbound Music**!
  - type: input
    id: version
    attributes:
      label: App Version
      description: What version of Unbound Music are you running?
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Platform
      options:
        - Android 14+
        - Android 12-13
        - Android 10-11
        - Windows 11/10
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Logcat
      description: Please paste any relevant log output or stack traces.
      render: shell
