name: ✨ Feature Request
description: Suggest an idea or enhancement for Unbound Music
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a new idea for **Unbound Music**!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you have considered.
